[project]
name = "clr-routing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "datasets>=3.0",
    "transformers>=4.45",
    "wandb>=0.18",
    "hydra-core>=1.3",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "rich",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
    "jupyter",
]
